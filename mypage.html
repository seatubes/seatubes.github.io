<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>マイページ · SeaTubes</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-void: #03070c;
    --deep-panel: #0a141f;
    --deep-panel-2: #0e1c2b;
    --line: rgba(120,160,175,0.16);
    --line-strong: rgba(120,160,175,0.3);
    --foam: #d7f3ee;
    --foam-dim: #8aa5ae;
    --bio: #59e6c7;
    --bio-dim: #2f8f7d;
    --coral: #ff7a63;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; min-height:100%; background: var(--deep-void);
    color: var(--foam); font-family:'Inter', sans-serif;
  }
  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; }

  .wrap{
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 50px);
  }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 24px; }
  .brand{ display:flex; align-items:center; gap:8px; text-decoration:none; }
  .brand svg{ width:24px; height:24px; color:var(--bio); }
  .brand span{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:1rem; color:var(--foam); }
  .back-link{
    font-size:0.82rem; color:var(--foam-dim); text-decoration:none;
    display:flex; align-items:center; gap:5px;
  }
  .back-link svg{ width:14px; height:14px; }

  .hero{ margin-bottom: 20px; }
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.72rem; color:var(--bio); margin-bottom:10px;
  }
  .hero .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--bio); }
  .hero h1{ font-size:1.5rem; font-weight:600; margin:0 0 8px; letter-spacing:-0.01em; }
  .hero p{ font-size:0.88rem; color:var(--foam-dim); line-height:1.6; margin:0; }

  .tabs{
    display:flex; gap:8px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn{
    flex:1; text-align:center; padding: 12px 8px;
    background:none; border:none; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:0.88rem; font-weight:600;
    color: var(--foam-dim);
    border-bottom: 2px solid transparent;
    margin-bottom:-1px;
  }
  .tab-btn.active{ color: var(--bio); border-bottom-color: var(--bio); }

  .grid{
    display:grid; grid-template-columns: repeat(2, 1fr); gap:10px;
  }
  .card{
    position:relative; border-radius:14px; overflow:hidden;
    background: var(--deep-panel); border:1px solid var(--line);
    aspect-ratio: 9 / 16;
    cursor:pointer;
  }
  .card video{ width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  .card .card-scrim{
    position:absolute; left:0; right:0; bottom:0; height:55%;
    background: linear-gradient(to top, rgba(2,6,10,0.92), transparent);
    pointer-events:none;
  }
  .card .card-meta{
    position:absolute; left:9px; right:9px; bottom:9px;
  }
  .card .card-title{
    font-size:0.78rem; font-weight:600; color:var(--foam);
    line-height:1.3; margin:0 0 4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .card-likes{
    display:flex; align-items:center; gap:4px;
    font-size:0.7rem; color:var(--foam-dim);
  }
  .card .card-likes svg{ width:11px; height:11px; color: var(--coral); }

  .empty-state{
    text-align:center; padding: 60px 20px;
  }
  .empty-state .glyph{ width:44px; height:44px; margin:0 auto 16px; color:var(--bio-dim); }
  .empty-state h3{ font-size:1.05rem; margin:0 0 8px; color:var(--foam); }
  .empty-state p{ font-size:0.85rem; color:var(--foam-dim); line-height:1.6; margin:0 0 20px; }
  .cta-link{
    display:inline-flex; align-items:center; gap:8px;
    padding: 10px 20px; border-radius: 999px;
    background: var(--bio); color: #02201a; font-weight:600; font-size:0.84rem;
    text-decoration:none; font-family:'Space Grotesk', sans-serif;
  }

  .spinner{
    width:26px; height:26px; border-radius:50%;
    border: 2px solid rgba(89,230,199,0.2);
    border-top-color: var(--bio);
    animation: spin 0.9s linear infinite;
    margin: 40px auto;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .panel{ display:none; }
  .panel.active{ display:block; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="brand" href="index.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M2 17c2 2 4 2 6 0s4-2 6 0 4 2 6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2 12c2 2 4 2 6 0s4-2 6 0 4 2 6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/><path d="M9 3c1.5 2 1.5 4 0 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>SeaTubes</span>
    </a>
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      フィードに戻る
    </a>
  </header>

  <div class="hero">
    <div class="eyebrow"><span class="dot"></span>MY PAGE</div>
    <h1>あなたの海</h1>
    <p>この端末（ブラウザ）に紐づく、投稿した動画といいねした動画がここに集まります。</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="posted">投稿した動画</button>
    <button class="tab-btn" data-tab="liked">いいねした動画</button>
  </div>

  <div class="panel active" id="panel-posted">
    <div class="spinner"></div>
  </div>
  <div class="panel" id="panel-liked">
    <div class="spinner"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qyxjzgkkriyxdezdlfir.supabase.co";
const SUPABASE_KEY = "sb_publishable_zB66kdVRi0F3SEGKXOhKHw_hMJ0eWj0";

const ICONS = {
  wave: `<svg viewBox="0 0 24 24" fill="none" class="glyph"><path d="M2 8c2.5 2.5 5 2.5 7.5 0S14.5 5.5 17 8s5 2.5 5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2 14c2.5 2.5 5 2.5 7.5 0s5-2.5 7.5 0 5 2.5 5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2 20c2.5 2.5 5 2.5 7.5 0s5-2.5 7.5 0 5 2.5 5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7.5-4.6-10-9.3C.5 7.2 2.4 3.8 6 3.4c2.1-.2 3.9.9 6 3.1 2.1-2.2 3.9-3.3 6-3.1 3.6.4 5.5 3.8 4 7.3C19.5 15.4 12 20 12 20z"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
};

// ----------------------------------------------
// 匿名ユーザーID（Cookie） - index.html / upload.html と同じ仕組み
// ----------------------------------------------
function getCookie(name){
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value, days){
  const maxAge = days * 24 * 60 * 60;
  document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${maxAge}; path=/; SameSite=Lax`;
}
function getOrCreateUserId(){
  let uid = getCookie('st_uid');
  if(!uid){
    uid = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
    setCookie('st_uid', uid, 365);
  }
  return uid;
}
const USER_ID = getOrCreateUserId();

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function emptyStateHTML(title, desc){
  return `
    <div class="empty-state">
      ${ICONS.wave}
      <h3>${title}</h3>
      <p>${desc}</p>
      <a class="cta-link" href="upload.html">${ICONS.play}動画をアップロード</a>
    </div>`;
}

async function fetchLikeCounts(videoIds){
  if(!videoIds.length) return {};
  const idList = videoIds.join(',');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/likes?select=video_id&video_id=in.(${idList})`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  const counts = {};
  if(res.ok){
    const rows = await res.json();
    rows.forEach(r => { counts[r.video_id] = (counts[r.video_id] || 0) + 1; });
  }
  return counts;
}

function renderGrid(container, videos, counts){
  if(!videos.length){
    return;
  }
  container.innerHTML = `<div class="grid">${videos.map(v => `
    <a class="card" href="index.html?videos=${v.id}">
      <video src="${escapeHTML(v.video_url)}" muted playsinline preload="metadata"></video>
      <div class="card-scrim"></div>
      <div class="card-meta">
        <p class="card-title">${escapeHTML(v.title || '無題')}</p>
        <div class="card-likes">${ICONS.heart}${counts[v.id] || 0}</div>
      </div>
    </a>
  `).join('')}</div>`;
}

async function loadPosted(){
  const container = document.getElementById('panel-posted');
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&uploader_id=eq.${encodeURIComponent(USER_ID)}&order=created_at.desc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if(!res.ok) throw new Error('failed');
    const videos = await res.json();

    if(!videos.length){
      container.innerHTML = emptyStateHTML('まだ投稿がありません', 'あなたが投稿した動画がここに並びます。最初の一本を流してみましょう。');
      return;
    }

    const counts = await fetchLikeCounts(videos.map(v => v.id));
    renderGrid(container, videos, counts);
  }catch(err){
    console.error(err);
    container.innerHTML = emptyStateHTML('読み込みに失敗しました', '通信状態を確認して、もう一度お試しください。');
  }
}

async function loadLiked(){
  const container = document.getElementById('panel-liked');
  try{
    const likesRes = await fetch(
      `${SUPABASE_URL}/rest/v1/likes?select=video_id&user_id=eq.${encodeURIComponent(USER_ID)}&order=created_at.desc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if(!likesRes.ok) throw new Error('failed');
    const likeRows = await likesRes.json();

    if(!likeRows.length){
      container.innerHTML = emptyStateHTML('まだいいねした動画がありません', '気に入った動画にハートを付けると、ここに集まります。');
      return;
    }

    const idList = likeRows.map(r => r.video_id).join(',');
    const videosRes = await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&id=in.(${idList})`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if(!videosRes.ok) throw new Error('failed');
    let videos = await videosRes.json();

    // いいねした順（新しい順）に並べ替え
    const orderMap = new Map(likeRows.map((r, i) => [r.video_id, i]));
    videos.sort((a, b) => (orderMap.get(a.id) ?? 0) - (orderMap.get(b.id) ?? 0));

    const counts = await fetchLikeCounts(videos.map(v => v.id));
    renderGrid(container, videos, counts);
  }catch(err){
    console.error(err);
    container.innerHTML = emptyStateHTML('読み込みに失敗しました', '通信状態を確認して、もう一度お試しください。');
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
  });
});

loadPosted();
loadLiked();
</script>
</body>
</html>
